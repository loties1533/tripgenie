services:
  - type: web
    name: tripgenie
    runtime: node
    region: frankfurt
    branch: final
    buildCommand: npm install && npm run client:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # --- IA (au moins une clé requise) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      # --- Tavily ---
      - key: TAVILY_API_KEY
        sync: false
      # --- Unsplash (photos HD — optionnel) ---
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      # --- Eventbrite (événements réels — optionnel) ---
      - key: EVENTBRITE_API_KEY
        sync: false
      # --- CORS (frontend URL en production) ---
      - key: CLIENT_URL
        value: https://tripgenie.onrender.com
      # --- Yelp (lieux locaux — optionnel) ---
      - key: YELP_API_KEY
        sync: false
      # --- OpenTripMap (POI — optionnel) ---
      - key: OPENTRIPMAP_API_KEY
        sync: false
      # --- Spotify (playlist — optionnel) ---
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
