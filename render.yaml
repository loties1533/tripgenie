services:
  - type: web
    name: tripgenie
    runtime: node
    region: frankfurt
    branch: main
    buildCommand: npm install && npx tsc && npm run client:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # --- IA ---
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      # --- Services externes ---
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      # --- CORS ---
      - key: CLIENT_URL
        value: https://tripgenie.onrender.com
