name: CI

on:
  push:
    branches:
      - main
      - feat/postgres-rls
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests et TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Verifier TypeScript
        run: npx tsc --noEmit

      - name: Lancer les tests
        run: npm run test:all
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dependances backend
        run: npm ci

      - name: Build serveur TypeScript
        run: npx tsc

      - name: Build client React
        run: cd client-react && npm ci && npm run build
